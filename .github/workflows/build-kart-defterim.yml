name: Build Kart Defterim APK

on:
  push:
    branches: ["kart-defterim-apk"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: kart-defterim
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Kart-Defterim-APK
          path: kart-defterim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
